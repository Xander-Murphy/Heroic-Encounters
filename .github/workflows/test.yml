# Runs the test suite on every pull request (shown as ✅/❌ before merging) and on pushes to main.
# The API tests also run against a throwaway MongoDB, like the live server's database.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017
